name: Refresh climatology

# The only scheduled job in the project. Everything else on the site is a live
# client-side fetch — notably forecast accuracy, which the Previous-Runs API
# serves complete, so there is nothing to accumulate here.
#
# Decade averages barely move, so monthly is generous; this mainly rolls the
# ten-year window forward as each new year completes.

on:
  schedule:
    - cron: '17 4 1 * *'      # 04:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Rebuild climatology from the ERA5 archive
        run: npm run climatology

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/climatology.json; then
            echo "No change to climatology data."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/climatology.json
          git commit -m "chore: refresh climatology from ERA5 archive"
          git push
