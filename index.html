<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Strict CSP. The browser-direct Anthropic call (Phase 2) means the API key
      lives in this origin, so we allow NO third-party scripts and inline only
      the style attributes we use for progress-bar widths. connect-src is
      pre-authorised for api.anthropic.com so Phase 2 needs no CSP change.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self'; connect-src 'self' https://api.anthropic.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'"
    />
    <title>Konuş — Learn Conversational Turkish</title>
    <meta name="description" content="A fun, efficient way to learn conversational Turkish." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/cards.css" />
    <link rel="stylesheet" href="css/chat.css" />
  </head>
  <body>
    <main id="app" class="app"></main>
    <script type="module" src="js/main.mjs"></script>
  </body>
</html>
